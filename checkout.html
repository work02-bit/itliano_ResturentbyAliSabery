<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | إيطاليانو</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-bar">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" fill="#a41f28"/>
          <path d="M24 10c5 0 8 4 8 9 0 3-1.5 5.5-3.5 7.2 3 .6 5 2.6 5 5.3 0 3-3 5.5-9.5 5.5s-9.5-2.5-9.5-5.5c0-2.7 2-4.7 5-5.3C17.5 24.5 16 22 16 19c0-5 3-9 8-9Z" fill="#f6efdd"/>
          <circle cx="27" cy="17" r="1.4" fill="#a41f28"/>
        </svg>
      </span>
      <span class="brand-text"><strong>إيطاليانو</strong><span>FRIED CHICKEN &amp; PIZZA</span></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="menu.html">المنيو</a>
      <a href="index.html#about">عن المطعم</a>
      <a href="index.html#branches">الفروع</a>
      <a href="cart.html">السلة</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-btn">
        <span data-icon="cart"></span><span class="label">السلة</span>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="nav-toggle" aria-label="فتح القائمة" data-icon="menu"></button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">الرئيسية</a> / <a href="cart.html">السلة</a> / <span>إتمام الطلب</span></div>
    <h1>بيانات التوصيل</h1>
  </div>
</section>

<main class="workspace container" id="workspace">
  <div class="workspace-grid">
    <div class="form-card">
      <form id="checkoutForm" novalidate>
        <div class="form-grid">
          <div class="field full" data-field="name">
            <label for="fName">الاسم بالكامل</label>
            <input type="text" id="fName" placeholder="مثال: أحمد محمد">
            <span class="field-error">من فضلك اكتب اسمك</span>
          </div>

          <div class="field full" data-field="phone">
            <label for="fPhone">رقم الهاتف</label>
            <input type="tel" id="fPhone" placeholder="01xxxxxxxxx" dir="ltr" style="text-align:right">
            <span class="field-error">رقم الهاتف غير صحيح</span>
          </div>

          <div class="field full" data-field="address">
            <label for="fAddress">العنوان بالتفصيل</label>
            <input type="text" id="fAddress" placeholder="المنطقة، الشارع، رقم العقار">
            <span class="field-error">من فضلك اكتب العنوان</span>
          </div>

          <div class="field full" data-field="branch">
            <label>اختر الفرع</label>
            <div class="branch-options" id="branchOptions"></div>
            <span class="field-error">من فضلك اختر الفرع الأقرب لك</span>
          </div>

          <div class="field full">
            <label for="fNotes">ملاحظات إضافية (اختياري)</label>
            <textarea id="fNotes" placeholder="مثال: من غير بصل، اتصل قبل الوصول..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px">
          تأكيد الطلب ومتابعة الفاتورة
        </button>
      </form>
    </div>

    <aside class="summary-card" id="summarySide"></aside>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 إيطاليانو. جميع الحقوق محفوظة.</span>
      <a href="cart.html">العودة للسلة</a>
    </div>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/main.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
